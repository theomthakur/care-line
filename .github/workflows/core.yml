name: MemberGuide core

on:
  push:
    branches: [main, booking-core]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv
      - run: uv run --with httpx python -m pytest tests/core -q
      - run: uv run ruff format --check backend tests/core
      - run: uv run ruff check backend tests/core
